name: CI

on:
  push:
    branches: [main, dev]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install libtorrent (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libtorrent-rasterbar-dev build-essential cmake

      - name: Install libtorrent (macOS)
        if: runner.os == 'macOS'
        run: brew install libtorrent-rasterbar

      # Windows: libtorrent pulls a large Boost/OpenSSL graph (~70 packages).
      # vcpkg x-gha binary cache stores each package by ABI hash in GHA cache.
      # First run builds from source; every subsequent run downloads pre-built binaries.
      - name: Export GHA cache vars for vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL)
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN)

      - name: Install libtorrent (Windows)
        if: runner.os == 'Windows'
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: vcpkg install libtorrent:x64-windows-static

      - name: Build
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA="-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static"
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release $EXTRA
          cmake --build build --config Release -j4

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Publish tag & release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          REPO="${{ github.repository }}"

          VERSION=$(grep -m1 "^project(vozduxan VERSION" CMakeLists.txt \
            | sed 's/.*VERSION \([0-9][0-9.]*\).*/\1/')

          if [ "$REF_NAME" = "dev" ]; then
            TAG="v${VERSION}-dev"
            PRERELEASE=(--prerelease)
          else
            TAG="v${VERSION}"
            PRERELEASE=()
          fi

          gh release delete "$TAG" --repo "$REPO" --yes 2>/dev/null || true
          gh api --method DELETE -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/git/refs/tags/$TAG" 2>/dev/null || true

          gh release create "$TAG" \
            --repo "$REPO" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --notes "vozduxan ${TAG}" \
            "${PRERELEASE[@]}"
